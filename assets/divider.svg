<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 44" width="800" height="44">
  <!-- ground line -->
  <line x1="0" y1="38" x2="800" y2="38" stroke="#0d9488" stroke-width="1" opacity="0.4"/>
  <!-- shadow -->
  <ellipse rx="10" ry="2.5" fill="#06b6d4" opacity="0.18">
    <animate attributeName="cx" from="14" to="786" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" from="40" to="40" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <!-- ball -->
  <circle r="6" fill="#06b6d4">
    <animate attributeName="cx" from="14" to="786" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy"
      values="31;38;31;38;31;38;31"
      keyTimes="0;0.167;0.333;0.5;0.667;0.833;1"
      keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
      calcMode="spline"
      dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>

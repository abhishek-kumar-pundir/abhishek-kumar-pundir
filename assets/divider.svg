      <rect x="1" y="14" width="12" height="1"/>
      <rect x="2" y="15" width="11" height="1"/>
      <rect x="3" y="16" width="9" height="1"/>
      <rect x="4" y="17" width="7" height="1"/>
      <rect x="5" y="18" width="2" height="1"/>
      <rect x="9" y="18" width="2" height="1"/>
      <rect x="6" y="19" width="2" height="1"/>
      <rect x="10" y="19" width="1" height="1"/>
      <rect x="10" y="20" width="1" height="1"/>
      <rect x="10" y="21" width="2" height="1"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 30" width="800" height="30" shape-rendering="crispEdges">
  <!-- Minimal ground line with subtle pixel pebbles -->
  <line x1="0" y1="26" x2="800" y2="26" stroke="#0d9488" stroke-width="1" opacity="0.35"/>
  <rect x="120" y="28" width="4" height="1" fill="#0d9488" opacity="0.3"/>
  <rect x="280" y="27" width="6" height="1" fill="#0d9488" opacity="0.3"/>
  <rect x="470" y="28" width="5" height="1" fill="#0d9488" opacity="0.3"/>
  <rect x="690" y="27" width="4" height="1" fill="#0d9488" opacity="0.3"/>

  <!-- Pixel-art Dino walking across divider (12s relaxed pace) -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      from="-25 4"
      to="825 4"
      dur="12s"
      repeatCount="indefinite"
    />

    <!-- Leg Frame 1 -->
    <g fill="#5eead4">
      <animate
        attributeName="display"
        values="inline;none;inline"
        keyTimes="0;0.5;1"
        dur="0.24s"
        repeatCount="indefinite"
        calcMode="discrete"
      />
      <rect x="11" y="0" width="8" height="1"/>
      <rect x="10" y="1" width="10" height="1"/>
      <rect x="10" y="2" width="2" height="1"/>
      <rect x="13" y="2" width="7" height="1"/>
      <rect x="10" y="3" width="10" height="1"/>
      <rect x="10" y="4" width="10" height="1"/>
      <rect x="10" y="5" width="10" height="1"/>
      <rect x="10" y="6" width="5" height="1"/>
      <rect x="10" y="7" width="8" height="1"/>
      <rect x="0" y="8" width="1" height="1"/>
      <rect x="9" y="8" width="5" height="1"/>
      <rect x="0" y="9" width="1" height="1"/>
      <rect x="8" y="9" width="6" height="1"/>
      <rect x="0" y="10" width="2" height="1"/>
      <rect x="6" y="10" width="10" height="1"/>
      <rect x="0" y="11" width="3" height="1"/>
      <rect x="5" y="11" width="9" height="1"/>
      <rect x="15" y="11" width="1" height="1"/>
      <rect x="0" y="12" width="14" height="1"/>
      <rect x="0" y="13" width="14" height="1"/>
      <rect x="1" y="14" width="12" height="1"/>
      <rect x="2" y="15" width="11" height="1"/>
      <rect x="3" y="16" width="9" height="1"/>
      <rect x="4" y="17" width="7" height="1"/>
      <rect x="5" y="18" width="3" height="1"/>
      <rect x="10" y="18" width="3" height="1"/>
      <rect x="5" y="19" width="2" height="1"/>
      <rect x="5" y="20" width="1" height="1"/>
      <rect x="5" y="21" width="2" height="1"/>
    </g>

    <!-- Leg Frame 2 -->
    <g fill="#5eead4">
      <animate
        attributeName="display"
        values="none;inline;none"
        keyTimes="0;0.5;1"
        dur="0.24s"
        repeatCount="indefinite"
        calcMode="discrete"
      />
      <rect x="11" y="0" width="8" height="1"/>
      <rect x="10" y="1" width="10" height="1"/>
      <rect x="10" y="2" width="2" height="1"/>
      <rect x="13" y="2" width="7" height="1"/>
      <rect x="10" y="3" width="10" height="1"/>
      <rect x="10" y="4" width="10" height="1"/>
      <rect x="10" y="5" width="10" height="1"/>
      <rect x="10" y="6" width="5" height="1"/>
      <rect x="10" y="7" width="8" height="1"/>
      <rect x="0" y="8" width="1" height="1"/>
      <rect x="9" y="8" width="5" height="1"/>
      <rect x="0" y="9" width="1" height="1"/>
      <rect x="8" y="9" width="6" height="1"/>
      <rect x="0" y="10" width="2" height="1"/>

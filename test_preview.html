ath the surface: how a browser schedules resources, how audio moves through a graph of nodes, how separate signals combine into one decision.<br/>\nI build tools and systems that aim to be useful, efficient, and reliable, and I try to back what I say about them with measurements.\n</p>\n\n---\n\n<p align=\"center\">\n  <img src=\"https://readme-typing-svg.demolab.com?font=Plus+Jakarta+Sans&weight=700&size=28&duration=1500&repeat=false&color=79B47E&center=true&vCenter=true&width=360&height=50&lines=%F0%9F%9B%A0%EF%B8%8F+Tech+Stack\" alt=\"\ud83d\udee0\ufe0f Tech Stack\" />\n</p>\n\n<p align=\"center\">\n<img src=\"https://img.shields.io/badge/JavaScript-F7DF1E?style=for-the-badge&logo=javascript&logoColor=black\" height=\"40\" alt=\"JavaScript\" />\n<img src=\"https://img.shields.io/badge/TypeScript-3178C6?style=for-the-badge&logo=typescript&logoColor=white\" height=\"40\" alt=\"TypeScript\" />\n<img src=\"https://img.shields.io/badge/Python-3776AB?style=for-the-badge&logo=python&logoColor=white\" height=\"40\" alt=\"Python\" />\n<img src=\"https://img.shields.io/badge/Java-ED8B00?style=for-the-badge&logo=openjdk&logoColor=white\" height=\"40\" alt=\"Java\" />\n<img src=\"https://img.shields.io/badge/C-A8B9CC?style=for-the-badge&logo=c&logoColor=black\" height=\"40\" alt=\"C\" />\n<img src=\"https://img.shields.io/badge/C%2B%2B-00599C?style=for-the-badge&logo=c%2B%2B&logoColor=white\" height=\"40\" alt=\"C++\" />\n<img src=\"https://img.shields.io/badge/React-61DAFB?style=for-the-badge&logo=react&logoColor=black\" height=\"40\" alt=\"React\" />\n<img src=\"https://img.shields.io/badge/Vite-646CFF?style=for-the-badge&logo=vite&logoColor=white\" height=\"40\" alt=\"Vite\" />\n<img src=\"https://img.shields.io/badge/Tailwind_CSS-38B2AC?style=for-the-badge&logo=tailwind-css&logoColor=white\" height=\"40\" alt=\"Tailwind CSS\" />\n<img src=\"https://img.shields.io/badge/Node.js-339933?style=for-the-badge&logo=node.js&logoColor=white\" height=\"40\" alt=\"Node.js\" />\n<img src=\"https://img.shields.io/badge/Express-000000?style=for-the-badge&logo=express&logoColor=white\" height=\"40\" alt=\"Express\" />\n<img src=\"https://img.shields.io/badge/FastAPI-009688?style=for-the-badge&logo=fastapi&logoColor=white\" height=\"40\" alt=\"FastAPI\" />\n<img src=\"https://img.shields.io/badge/MongoDB-47A248?style=for-the-badge&logo=mongodb&logoColor=white\" height=\"40\" alt=\"MongoDB\" />\n<img src=\"https://img.shields.io/badge/PostgreSQL-4169E1?style=for-the-badge&logo=postgresql&logoColor=white\" height=\"40\" alt=\"PostgreSQL\" />\n<img src=\"https://img.shields.io/badge/SQLite-003B57?style=for-the-badge&logo=sqlite&logoColor=white\" height=\"40\" alt=\"SQLite\" />\n<img src=\"https://img.shields.io/badge/Cloudinary-3448C5?style=for-the-badge&logo=cloudinary&logoColor=white\" height=\"40\" alt=\"Cloudinary\" />\n<img src=\"https://img.shields.io/badge/Socket.IO-010101?style=for-the-badge&logo=socket.io&logoColor=white\" height=\"40\" alt=\"Socket.IO\" />\n<img src=\"https://img.shields.io/badge/Three.js-000000?style=for-the-badge&logo=three.js&logoColor=white\" height=\"40\" alt=\"Three.js\" />\n<img src=\"https://img.shields.io/badge/PyTorch-EE4C2C?style=for-the-badge&logo=pytorch&logoColor=white\" height=\"40\" alt=\"PyTorch\" />\n<img src=\"https://img.shields.io/badge/TensorFlow-FF6F00?style=for-the-badge&logo=tensorflow&logoColor=white\" height=\"40\" alt=\"TensorFlow\" />\n<img src=\"https://img.shields.io/badge/scikit--learn-F7931E?style=for-the-badge&logo=scikit-learn&logoColor=white\" height=\"40\" alt=\"scikit-learn\" />\n<img src=\"https://img.shields.io/badge/NumPy-013243?style=for-the-badge&logo=numpy&logoColor=white\" height=\"40\" alt=\"NumPy\" />\n<img src=\"https://img.shields.io/badge/pandas-150458?style=for-the-badge&logo=pandas&logoColor=white\" height=\"40\" alt=\"pandas\" />\n<img src=\"https://img.shields.io/badge/Matplotlib-11557c?style=for-the-badge&logo=matplotlib&logoColor=white\" height=\"40\" alt=\"Matplotlib\" />\n<img src=\"https://img.shields.io/badge/OpenCV-5C3EE8?style=for-the-badge&logo=opencv&logoColor=white\" height=\"40\" alt=\"OpenCV\" />\n<img src=\"https://img.shields.io/badge/Hugging_Face-FFD21E?style=for-the-badge&logo=huggingface&logoColor=black\" height=\"40\" alt=\"Hugging Face\" />\n<img src=\"https://img.shields.io/badge/Groq-F54D27?style=for-the-badge&logo=groq&logoColor=white\" height=\"40\" alt=\"Groq\" />\n<img src=\"https://img.shields.io/badge/FFmpeg-007808?style=for-the-badge&logo=ffmpeg&logoColor=white\" height=\"40\" alt=\"FFmpeg\" />\n<img src=\"https://img.shields.io/badge/Zustand-443E38?style=for-the-badge\" height=\"40\" alt=\"Zustand\" />\n<img src=\"https://img.shields.io/badge/Chrome_Extensions_%2F_Manifest_V3-4285F4?style=for-the-badge&logo=googlechrome&logoColor=white\" height=\"40\" alt=\"Chrome Extensions / Manifest V3\" />\n<img src=\"https://img.shields.io/badge/Git-F05032?style=for-the-badge&logo=git&logoColor=white\" height=\"40\" alt=\"Git\" />\n<img src=\"https://img.shields.io/badge/npm-CB3837?style=for-the-badge&logo=npm&logoColor=white\" height=\"40\" alt=\"npm\" />\n<img src=\"https://img.shields.io/badge/Vercel-000000?style=for-the-badge&logo=vercel&logoColor=white\" height=\"40\" alt=\"Vercel\" />\n<img src=\"https://img.shields.io/badge/Render-46E3B7?style=for-the-badge&logo=render&logoColor=black\" height=\"40\" alt=\"Render\" />\n</p>\n\n---\n\n<p align=\"center\">\n  <img src=\"https://readme-typing-svg.demolab.com?font=Plus+Jakarta+Sans&weight=700&size=28&duration=1500&repeat=false&color=79B47E&center=true&vCenter=true&width=500&height=50&lines=%F0%9F%9A%80+Featured+Projects\" alt=\"\ud83d\ude80 Featured Projects\" />\n</p>\n\n<table width=\"100%\">\n<tr>\n<td width=\"50%\" valign=\"top\">\n\n### <img src=\"./assets/icons/npm.svg\" width=\"20\" height=\"20\" alt=\"ReactFastLoad icon\" valign=\"middle\"/> ReactFastLoad\n\nReact resource scheduler for priority-based loading, concurrency control, and viewport-aware resource orchestration. Five priority levels, a shared `IntersectionObserver` for viewport preloading, a concurrency cap, and connection-aware back-pressure, with no fetch interception.\n\n**Package size** (not a speed measurement): 41.06 KB ESM \u00b7 41.89 KB CommonJS \u00b7 100.3 KB npm tarball.\n\n<p>\n  <img src=\"https://img.shields.io/badge/React-61DAFB&logo=react&logoColor=black?style=flat-square\" alt=\"React\" />\n  <img src=\"https://img.shields.io/badge/TypeScript-3178C6&logo=typescript&logoColor=white?style=flat-square\" alt=\"TypeScript\" />\n  <img src=\"https://img.shields.io/badge/ESM_+_CJS-23272D&logo=javascript&logoColor=F0EEE8?style=flat-square\" alt=\"ESM + CJS\" />\n</p>\n\n[![npm](https://img.shields.io/npm/v/react-fastload?style=flat-square&logo=npm&labelColor=23272D&color=CB3837)](https://www.npmjs.com/package/react-fastload)\n[![Repository](https://img.shields.io/badge/GitHub-Repository-17191C?style=flat-square&logo=github&logoColor=79B47E&labelColor=23272D)](https://github.com/abhishek-kumar-pundir/react-fastload)\n\n</td>\n<td width=\"50%\" valign=\"top\">\n\n### <img src=\"./assets/icons/musify_logo.png\" width=\"20\" height=\"20\" alt=\"Musify logo\" valign=\"middle\"/> Musify\n\nMERN music platform with server-side audio processing (RMS energy, FFT spectral centroid, onset-autocorrelation tempo), waveform visualization, cosine-similarity recommendations, and transition-aware prefetching.\n\n**29.13% less initial gzip JavaScript transfer** with ReactFastLoad (142.26 KB \u2192 100.82 KB) in a five-trial local Chrome benchmark. Cold-cache FCP and LCP were slightly slower (+20 ms, +36 ms). Local results, not production users.\n\n<p>\n  <img src=\"https://img.shields.io/badge/React%2019-61DAFB&logo=react&logoColor=black?style=flat-square\" alt=\"React 19\" />\n  <img src=\"https://img.shields.io/badge/Express-000000&logo=express&logoColor=white?style=flat-square\" alt=\"Express\" />\n  <img src=\"https://img.shields.io/badge/MongoDB-47A248&logo=mongodb&logoColor=white?style=flat-square\" alt=\"MongoDB\" />\n  <img src=\"https://img.shields.io/badge/ffmpeg-007808&logo=ffmpeg&logoColor=white?style=flat-square\" alt=\"ffmpeg\" />\n</p>\n\n[![Repository](https://img.shields.io/badge/GitHub-Repository-17191C?style=flat-square&logo=github&logoColor=79B47E&labelColor=23272D)](https://github.com/Abhishe295/Musfiy)\n\n</td>\n</tr>\n\n<tr>\n<td width=\"50%\" valign=\"top\">\n\n### <img src=\"./assets/icons/phish360_icon.png\" width=\"20\" height=\"20\" alt=\"Phish360 icon\" valign=\"middle\"/> Phish360\n\nMultimodal phishing detection combining URL characteristics, webpage structure, webpage text, and visual signals through a late-fusion ensemble, with an evaluation pipeline for classification performance.\n\nDataset audit: 10,748 sample directories. This is the size of the raw collection, not a validated training-set size, and no model results are claimed here.\n\n<p>\n  <img src=\"https://img.shields.io/badge/React-61DAFB&logo=react&logoColor=black?style=flat-square\" alt=\"React\" />\n  <img src=\"https://img.shields.io/badge/TypeScript-3178C6&logo=typescript&logoColor=white?style=flat-square\" alt=\"TypeScript\" />\n  <img src=\"https://img.shields.io/badge/FastAPI-009688&logo=fastapi&logoColor=white?style=flat-square\" alt=\"FastAPI\" />\n  <img src=\"https://img.shields.io/badge/PyTorch-EE4C2C&logo=pytorch&logoColor=white?style=flat-square\" alt=\"PyTorch\" />\n  <img src=\"https://img.shields.io/badge/Chrome%20MV3-4285F4&logo=googlechrome&logoColor=white?style=flat-square\" alt=\"Chrome MV3\" />\n</p>\n\n[![Repository](https://img.shields.io/badge/GitHub-Repository-17191C?style=flat-square&logo=github&logoColor=79B47E&labelColor=23272D)](https://github.com/abhishek-kumar-pundir/Phishing)\n\n</td>\n<td width=\"50%\" valign=\"top\">\n\n### <img src=\"./assets/icons/hush_icon.png\" width=\"20\" height=\"20\" alt=\"Hush icon\" valign=\"middle\"/> Hush\n\nBrowser audio-management extension with per-tab volume control, smooth gain transitions, and intelligent audio coordination. Handles both HTML5 media and Web Audio API contexts, supports native tab muting, and organizes tabs into Chrome Tab Groups across four audio scenes.\n\n> Chrome Web Store: **Published** \u2014 install directly from the [Chrome Web Store](https://chromewebstore.google.com/detail/hush/dbbkabhnlodiikoebjiijgcfoeiakiop).\n\n<p>\n  <img src=\"https://img.shields.io/badge/React%2019-61DAFB&logo=react&logoColor=black?style=flat-square\" alt=\"React 19\" />\n  <img src=\"https://img.shields.io/badge/TypeScript-3178C6&logo=typescript&logoColor=white?style=flat-square\" alt=\"TypeScript\" />\n  <img src=\"https://img.shields.io/badge/Vite-646CFF&logo=vite&logoColor=white?style=flat-square\" alt=\"Vite\" />\n  <img src=\"https://img.shields.io/badge/Chrome%20MV3-4285F4&logo=googlechrome&logoColor=white?style=flat-square\" alt=\"Chrome MV3\" />\n</p>\n\n[![Chrome Web Store](https://img.shields.io/badge/Chrome_Web_Store-Published-4285F4?style=flat-square&logo=googlechrome&logoColor=white&labelColor=23272D)](https://chromewebstore.google.com/detail/hush/dbbkabhnlodiikoebjiijgcfoeiakiop)\n[![Repository](https://img.shields.io/badge/GitHub-Repository-17191C?style=flat-square&logo=github&logoColor=79B47E&labelColor=23272D)](https://github.com/abhishek-kumar-pundir/Hush)\n\n</td>\n</tr>\n</table>\n\n<details>\n<summary><b>+ ProjectU: private real-time app for two</b></summary>\n<br/>\n\nCollaborative social platform featuring private pairing, real-time chat, synchronized music listening, mood sharing, and shared links. Built on Socket.IO with cryptographic pairing codes and HTTP-only JWT.\n\n<p>\n  <img src=\"https://img.shields.io/badge/React-61DAFB&logo=react&logoColor=black?style=flat-square\" alt=\"React\" />\n  <img src=\"https://img.shields.io/badge/Socket.IO-010101&logo=socket.io&logoColor=white?style=flat-square\" alt=\"Socket.IO\" />\n  <img src=\"https://img.shields.io/badge/Express-000000&logo=express&logo

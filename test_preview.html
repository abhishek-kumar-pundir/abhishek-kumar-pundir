<script>
  const rawMarkdown = "<div align=\"center\">\n\n<h1 align=\"center\">\n  <a href=\"https://git.io/typing-svg\">\n    <img\n      src=\"https://readme-typing-svg.demolab.com?font=Plus+Jakarta+Sans&weight=700&size=34&duration=2400&pause=5000&color=9294D6&center=true&vCenter=true&width=480&height=52&lines=Abhishek+Kumar+Pundir\"\n      alt=\"Abhishek Kumar Pundir\"\n    />\n  </a>\n</h1>\n\n<p>\n  <strong>Full-Stack Developer &bull; Systems & Web Audio &bull; npm Author</strong>\n</p>\n\n<a href=\"https://git.io/typing-svg\">\n  <img\n    src=\"https://readme-typing-svg.demolab.com?font=JetBrains+Mono&weight=500&size=14&pause=1100&color=79A879&center=true&vCenter=true&width=560&lines=full-stack+developer+%26+npm+library+author;building%3A+phishing+AI+%C2%B7+browser+audio+%C2%B7+music+DSP;TypeScript+%C2%B7+Python+%C2%B7+React+%C2%B7+Node.js+%C2%B7+FastAPI;I+write+code.+The+bugs+write+themselves.\"\n    alt=\"Typing SVG\"\n  />\n</a>\n\n<p style=\"margin-top: 14px;\">\n  <a href=\"https://github.com/abhishek-kumar-pundir\">\n    <img src=\"./assets/icons/badge-github.svg\" height=\"28\" alt=\"GitHub\"/>\n  </a>\n  &nbsp;\n  <a href=\"https://in.linkedin.com/in/abhishek-kumar-pundir\">\n    <img src=\"./assets/icons/badge-linkedin.svg\" height=\"28\" alt=\"LinkedIn\"/>\n  </a>\n  &nbsp;\n  <a href=\"https://abhishek-tg.vercel.app/\">\n    <img src=\"./assets/icons/badge-portfolio.svg\" height=\"28\" alt=\"Portfolio\"/>\n  </a>\n  &nbsp;\n  <a href=\"https://www.npmjs.com/package/react-fastload\">\n    <img src=\"./assets/icons/badge-npm.svg\" height=\"28\" alt=\"npm: react-fastload\"/>\n  </a>\n</p>\n\n</div>\n\n<img src=\"./assets/divider.svg\" width=\"100%\" alt=\"Desert Garden Divider\"/>\n\n### About Me\n\nI build developer tools, browser extensions, and full-stack systems \u2014 the kind of software that coordinates how resources load, detects phishing pages by fusing four ML signals, or quietly decides which browser tab should stop yelling. Mostly TypeScript and Python, occasionally regret. If it's a hard problem at the intersection of performance and AI, I'm already thinking about it.\n\n### Tech Stack\n\n<div align=\"center\">\n\n<img src=\"https://img.shields.io/badge/JavaScript-F7DF1E?style=flat-square&logo=javascript&logoColor=black\" height=\"32\" alt=\"JavaScript\" />\n<img src=\"https://img.shields.io/badge/TypeScript-3178C6?style=flat-square&logo=typescript&logoColor=white\" height=\"32\" alt=\"TypeScript\" />\n<img src=\"https://img.shields.io/badge/Python-3776AB?style=flat-square&logo=python&logoColor=white\" height=\"32\" alt=\"Python\" />\n<img src=\"https://img.shields.io/badge/Java-ED8B00?style=flat-square&logo=openjdk&logoColor=white\" height=\"32\" alt=\"Java\" />\n<img src=\"https://img.shields.io/badge/C-A8B9CC?style=flat-square&logo=c&logoColor=black\" height=\"32\" alt=\"C\" />\n<img src=\"https://img.shields.io/badge/C%2B%2B-00599C?style=flat-square&logo=c%2B%2B&logoColor=white\" height=\"32\" alt=\"C++\" />\n<img src=\"https://img.shields.io/badge/React-61DAFB?style=flat-square&logo=react&logoColor=black\" height=\"32\" alt=\"React\" />\n<img src=\"https://img.shields.io/badge/Vite-646CFF?style=flat-square&logo=vite&logoColor=white\" height=\"32\" alt=\"Vite\" />\n<img src=\"https://img.shields.io/badge/Tailwind_CSS-38B2AC?style=flat-square&logo=tailwind-css&logoColor=white\" height=\"32\" alt=\"Tailwind CSS\" />\n<img src=\"https://img.shields.io/badge/Node.js-339933?style=flat-square&logo=node.js&logoColor=white\" height=\"32\" alt=\"Node.js\" />\n<img src=\"https://img.shields.io/badge/Express-000000?style=flat-square&logo=express&logoColor=white\" height=\"32\" alt=\"Express\" />\n<img src=\"https://img.shields.io/badge/FastAPI-009688?style=flat-square&logo=fastapi&logoColor=white\" height=\"32\" alt=\"FastAPI\" />\n<img src=\"https://img.shields.io/badge/MongoDB-47A248?style=flat-square&logo=mongodb&logoColor=white\" height=\"32\" alt=\"MongoDB\" />\n<img src=\"https://img.shields.io/badge/PostgreSQL-4169E1?style=flat-square&logo=postgresql&logoColor=white\" height=\"32\" alt=\"PostgreSQL\" />\n<img src=\"https://img.shields.io/badge/SQLite-003B57?style=flat-square&logo=sqlite&logoColor=white\" height=\"32\" alt=\"SQLite\" />\n<img src=\"https://img.shields.io/badge/Cloudinary-3448C5?style=flat-square&logo=cloudinary&logoColor=white\" height=\"32\" alt=\"Cloudinary\" />\n<img src=\"https://img.shields.io/badge/Socket.IO-010101?style=flat-square&logo=socket.io&logoColor=white\" height=\"32\" alt=\"Socket.IO\" />\n<img src=\"https://img.shields.io/badge/Three.js-000000?style=flat-square&logo=three.js&logoColor=white\" height=\"32\" alt=\"Three.js\" />\n<img src=\"https://img.shields.io/badge/PyTorch-EE4C2C?style=flat-square&logo=pytorch&logoColor=white\" height=\"32\" alt=\"PyTorch\" />\n<img src=\"https://img.shields.io/badge/TensorFlow-FF6F00?style=flat-square&logo=tensorflow&logoColor=white\" height=\"32\" alt=\"TensorFlow\" />\n<img src=\"https://img.shields.io/badge/scikit--learn-F7931E?style=flat-square&logo=scikit-learn&logoColor=white\" height=\"32\" alt=\"scikit-learn\" />\n<img src=\"https://img.shields.io/badge/NumPy-013243?style=flat-square&logo=numpy&logoColor=white\" height=\"32\" alt=\"NumPy\" />\n<img src=\"https://img.shields.io/badge/pandas-150458?style=flat-square&logo=pandas&logoColor=white\" height=\"32\" alt=\"pandas\" />\n<img src=\"https://img.shields.io/badge/Matplotlib-11557c?style=flat-square&logo=matplotlib&logoColor=white\" height=\"32\" alt=\"Matplotlib\" />\n<img src=\"https://img.shields.io/badge/OpenCV-5C3EE8?style=flat-square&logo=opencv&logoColor=white\" height=\"32\" alt=\"OpenCV\" />\n<img src=\"https://img.shields.io/badge/Hugging_Face-FFD21E?style=flat-square&logo=huggingface&logoColor=black\" height=\"32\" alt=\"Hugging Face\" />\n<img src=\"https://img.shields.io/badge/Groq-F54D27?style=flat-square&logo=groq&logoColor=white\" height=\"32\" alt=\"Groq\" />\n<img src=\"https://img.shields.io/badge/FFmpeg-007808?style=flat-square&logo=ffmpeg&logoColor=white\" height=\"32\" alt=\"FFmpeg\" />\n<img src=\"https://img.shields.io/badge/Zustand-443E38?style=flat-square\" height=\"32\" alt=\"Zustand\" />\n<img src=\"https://img.shields.io/badge/Chrome_Extensions_%2F_Manifest_V3-4285F4?style=flat-square&logo=googlechrome&logoColor=white\" height=\"32\" alt=\"Chrome Extensions / Manifest V3\" />\n<img src=\"https://img.shields.io/badge/Git-F05032?style=flat-square&logo=git&logoColor=white\" height=\"32\" alt=\"Git\" />\n<img src=\"https://img.shields.io/badge/npm-CB3837?style=flat-square&logo=npm&logoColor=white\" height=\"32\" alt=\"npm\" />\n<img src=\"https://img.shields.io/badge/Vercel-000000?style=flat-square&logo=vercel&logoColor=white\" height=\"32\" alt=\"Vercel\" />\n<img src=\"https://img.shields.io/badge/Render-46E3B7?style=flat-square&logo=render&logoColor=black\" height=\"32\" alt=\"Render\" />\n\n</div>\n\n<img src=\"./assets/divider.svg\" width=\"100%\" alt=\"Desert Garden Divider\"/>\n\n### Featured Projects\n\n<table width=\"100%\">\n<tr>\n<td width=\"50%\" valign=\"top\">\n\n### <img src=\"./assets/icons/phish360_icon.png\" width=\"20\" height=\"20\" alt=\"Phish360 icon\" valign=\"middle\"/> Phish360\n\nMultimodal phishing detector that fuses URL lexical patterns, DOM structure, page text, and a live screenshot through a late-fusion ML ensemble \u2014 four independent signals, one verdict, zero blacklist dependency.\n\n<p>\n  <img src=\"https://img.shields.io/badge/React-61DAFB?style=flat-square&logo=react&logoColor=black\" alt=\"React\" />\n  <img src=\"https://img.shields.io/badge/TypeScript-3178C6?style=flat-square&logo=typescript&logoColor=white\" alt=\"TypeScript\" />\n  <img src=\"https://img.shields.io/badge/FastAPI-009688?style=flat-square&logo=fastapi&logoColor=white\" alt=\"FastAPI\" />\n  <img src=\"https://img.shields.io/badge/PyTorch-EE4C2C?style=flat-square&logo=pytorch&logoColor=white\" alt=\"PyTorch\" />\n  <img src=\"https://img.shields.io/badge/Chrome%20MV3-4285F4?style=flat-square&logo=googlechrome&logoColor=white\" alt=\"Chrome MV3\" />\n</p>\n\n[![Repo](https://img.shields.io/badge/GitHub-Repository-17191C?style=flat-square&logo=github&logoColor=79A879&labelColor=23272D)](https://github.com/abhishek-kumar-pundir/Phishing)\n\n</td>\n<td width=\"50%\" valign=\"top\">\n\n### <img src=\"./assets/icons/npm.svg\" width=\"20\" height=\"20\" alt=\"ReactFastLoad icon\" valign=\"middle\"/> ReactFastLoad\n\nnpm library that controls *when* React resources load, not just whether they do. Five priority levels, shared `IntersectionObserver` viewport preloading, concurrency cap, and connection-aware back-pressure \u2014 no fetch interception.\n\n<p>\n  <img src=\"https://img.shields.io/badge/React-61DAFB?style=flat-square&logo=react&logoColor=black\" alt=\"React\" />\n  <img src=\"https://img.shields.io/badge/TypeScript-3178C6?style=flat-square&logo=typescript&logoColor=white\" alt=\"TypeScript\" />\n  <img src=\"https://img.shields.io/badge/ESM_+_CJS-23272D?style=flat-square&logo=javascript&logoColor=F0EEE8\" alt=\"ESM + CJS\" />\n</p>\n\n[![npm](https://img.shields.io/npm/v/react-fastload?style=flat-square&logo=npm&labelColor=23272D&color=CB3837)](https://www.npmjs.com/package/react-fastload)\n[![Repo](https://img.shields.io/badge/GitHub-Repository-17191C?style=flat-square&logo=github&logoColor=79A879&labelColor=23272D)](https://github.com/abhishek-kumar-pundir/react-fastload)\n\n</td>\n</tr>\n\n<tr>\n<td width=\"50%\" valign=\"top\">\n\n### <img src=\"./assets/icons/hush_icon.png\" width=\"20\" height=\"20\" alt=\"Hush icon\" valign=\"middle\"/> Hush\n\nChrome extension with per-tab volume sliders and intelligent audio conflict resolution. Intercepts both HTML5 media and Web Audio API contexts. Organizes tabs into Chrome Tab Groups. Four acoustic scenes, drag-and-drop reclassification.\n\n> Chrome Web Store: **Pending Review** \u2014 load unpacked for local use.\n\n<p>\n  <img src=\"https://img.shields.io/badge/React%2019-61DAFB?style=flat-square&logo=react&logoColor=black\" alt=\"React 19\" />\n  <img src=\"https://img.shields.io/badge/TypeScript-3178C6?style=flat-square&logo=typescript&logoColor=white\" alt=\"TypeScript\" />\n  <img src=\"https://img.shields.io/badge/Vite-646CFF?style=flat-square&logo=vite&logoColor=white\" alt=\"Vite\" />\n  <img src=\"https://img.shields.io/badge/Chrome%20MV3-4285F4?style=flat-square&logo=googlechrome&logoColor=white\" alt=\"Chrome MV3\" />\n</p>\n\n[![Repo](https://img.shields.io/badge/GitHub-Repository-17191C?style=flat-square&logo=github&logoColor=79A879&labelColor=23272D)](https://github.com/abhishek-kumar-pundir/Hush)\n\n</td>\n<td width=\"50%\" valign=\"top\">\n\n### <img src=\"./assets/icons/musify_logo.png\" width=\"20\" height=\"20\" alt=\"Musify logo\" valign=\"middle\"/> Musify\n\nMusic platform with a real server-side DSP pipeline: RMS energy, FFT spectral centroid, onset-autocorrelation tempo, over a single 8 kHz PCM pass. Cosine-similarity recommendations, Markov-graph prefetching. ReactFastLoad cut initial bundle ~29.6%.\n\n<p>\n  <img src=\"https://img.shields.io/badge/React%2019-61DAFB?style=flat-square&logo=react&logoColor=black\" alt=\"React 19\" />\n  <img src=\"https://img.shields.io/badge/Express-000000?style=flat-square&logo=express&logoColor=white\" alt=\"Express\" />\n  <img src=\"https://img.shields.io/badge/MongoDB-47A248?style=flat-square&logo=mongodb&logoColor=white\" alt=\"MongoDB\" />\n  <img src=\"https://img.shields.io/badge/ffmpeg-007808?style=flat-square&logo=ffmpeg&logoColor=white\" alt=\"ffmpeg\" />\n  <img src=\"https://img.shields.io/badge/Groq%20LLM-F54D27?style=flat-square\" alt=\"Groq\" />\n</p>\n\n[![Repo](https://img.shields.io/badge/GitHub-Repository-17191C?style=flat-square&logo=github&logoColor=79A879&labelColor=23272D)](https://github.com/Abhishe295/Musfiy)\n\n</td>\n</tr>\n</table>\n\n<details>\n<summary><b>+ ProjectU \u2014 private real-time app for two</b></summary>\n<br/>\n\nReal-time private web app: live Socket.IO chat, synchronized music with playback lock, mood board, shared links. Secured with cryptographic pairing codes and HTTP-only JWT. ReactFastLoad cut initial bundle ~49% (307 kB \u2192 156 kB).\n\n<p>\n  <img src=\"https://img.shields.io/badge/React-61DAFB?style=flat-square&logo=react&logoColor=black\" alt=\"React\" />\n  <img src=\"https://img.shields.io/badge/Socket.IO-010101?style=flat-square&logo=socket.io&logoColor=white\" alt=\"Socket.IO\" />\n  <img src=\"https://img.shields.io/badge/Express-000000?style=flat-square&logo=express&logoColor=white\" alt=\"Express\" />\n  <img src=\"https://img.shields.io/badge/MongoDB-47A248?style=flat-square&logo=mongodb&logoColor=white\" alt=\"MongoDB\" />\n</p>\n\n[![Repo](https://img.shields.io/badge/GitHub-Repository-17191C?style=flat-square&logo=github&logoColor=79A879&labelColor=23272D)](https://github.com/abhishek-kumar-pundir/ProjectU)\n\n</details>\n\n### GitHub Activity\n\n<div align=\"center\">\n\n<img\n  src=\"https://github-readme-stats.vercel.app/api?username=abhishek-kumar-pundir&show_icons=true&theme=transparent&hide_border=true&title_color=79A879&icon_color=E4A16A&text_color=A6A9B0&bg_color=17191C&rank_icon=github\"\n  height=\"160\"\n  alt=\"GitHub Stats\"\n/>\n&nbsp;&nbsp;\n<img\n  src=\"https://github-readme-stats.vercel.app/api/top-langs/?username=abhishek-kumar-pundir&layout=compact&theme=transparent&hide_border=true&title_color=79A879&text_color=A6A9B0&bg_color=17191C&langs_count=8\"\n  height=\"160\"\n  alt=\"Top Languages\"\n/>\n\n</div>\n\n<!--\n  CONTRIBUTION SNAKE \u2014 add this workflow to enable:\n\n  File: .github/workflows/snake.yml\n  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  name: Generate Snake\n  on:\n    schedule: [{ cron: \"0 0 * * *\" }]\n    workflow_dispatch:\n  permissions: { contents: write }\n  jobs:\n    build:\n      runs-on: ubuntu-latest\n      steps:\n        - uses: Platane/snk@v3\n          with:\n            github_user_name: abhishek-kumar-pundir\n            outputs: |\n              dist/github-contribution-grid-snake-dark.svg?palette=github-dark\n        - uses: crazy-max/ghaction-github-pages@v4\n          with:\n            target_branch: output\n            build_dir: dist\n          env:\n            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n\n  Then run the workflow once from the Actions tab and uncomment below:\n  <img src=\"https://raw.githubusercontent.com/abhishek-kumar-pundir/abhishek-kumar-pundir/output/github-contribution-grid-snake-dark.svg\" width=\"100%\" alt=\"Contribution Snake\" />\n-->\n\n### Let's Connect\n\n<div align=\"center\">\n\n<a href=\"https://github.com/abhishek-kumar-pundir\">\n  <img src=\"./assets/icons/badge-github.svg\" height=\"32\" alt=\"GitHub\"/>\n</a>\n&nbsp;&nbsp;\n<a href=\"https://in.linkedin.com/in/abhishek-kumar-pundir\">\n  <img src=\"./assets/icons/badge-linkedin.svg\" height=\"32\" alt=\"LinkedIn\"/>\n</a>\n&nbsp;&nbsp;\n<a href=\"https://abhishek-tg.vercel.app/\">\n  <img src=\"./assets/icons/badge-portfolio.svg\" height=\"32\" alt=\"Portfolio\"/>\n</a>\n&nbsp;&nbsp;\n<a href=\"https://www.npmjs.com/package/react-fastload\">\n  <img src=\"./assets/icons/badge-npm.svg\" height=\"32\" alt=\"npm: react-fastload\"/>\n</a>\n\n</div>\n";
